<div class="app-dialog__header">
    <div class="app-dialog__header-top">
        <h2 mat-dialog-title class="app-dialog__title">Cambiar Contraseña</h2>
        <button mat-icon-button class="app-dialog__close" type="button" (click)="onNoClick()" aria-label="Cerrar">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <p class="app-dialog__description">Actualiza la contraseña de tu cuenta.</p>
</div>

<mat-dialog-content class="app-dialog__content">
    <form [formGroup]="changePasswordForm">
        <div class="app-dialog__field">
            <label class="app-dialog__label" for="cp-actual">Contraseña Actual</label>
            <mat-form-field appearance="outline" class="app-dialog__input"
                [class.app-dialog__input--invalid]="changePasswordForm.get('passwordActual')?.invalid && changePasswordForm.get('passwordActual')?.touched">
                <input id="cp-actual" formControlName="passwordActual" matInput
                    [type]="hidePasswordActual ? 'password' : 'text'" placeholder="••••••">
                <button mat-icon-button matSuffix type="button" (click)="hidePasswordActual = !hidePasswordActual"
                    aria-label="Mostrar contraseña">
                    <mat-icon>{{ hidePasswordActual ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>
            <span class="app-dialog__error"
                *ngIf="changePasswordForm.get('passwordActual')?.invalid && changePasswordForm.get('passwordActual')?.touched">
                La contraseña actual debe tener al menos 4 caracteres.
            </span>
        </div>

        <div class="app-dialog__field">
            <label class="app-dialog__label" for="cp-nueva">Nueva Contraseña</label>
            <mat-form-field appearance="outline" class="app-dialog__input"
                [class.app-dialog__input--invalid]="changePasswordForm.get('nuevaPassword')?.invalid && changePasswordForm.get('nuevaPassword')?.touched">
                <input id="cp-nueva" formControlName="nuevaPassword" matInput
                    [type]="hidePasswordNueva ? 'password' : 'text'" placeholder="••••••">
                <button mat-icon-button matSuffix type="button" (click)="hidePasswordNueva = !hidePasswordNueva"
                    aria-label="Mostrar contraseña">
                    <mat-icon>{{ hidePasswordNueva ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>
            <span class="app-dialog__error"
                *ngIf="changePasswordForm.get('nuevaPassword')?.invalid && changePasswordForm.get('nuevaPassword')?.touched">
                La contraseña debe tener al menos 4 caracteres.
            </span>
        </div>

        <div class="app-dialog__field">
            <label class="app-dialog__label" for="cp-confirmar">Confirmar Contraseña</label>
            <mat-form-field appearance="outline" class="app-dialog__input"
                [class.app-dialog__input--invalid]="(changePasswordForm.get('confirmarPassword')?.invalid || changePasswordForm.hasError('noCoinciden')) && changePasswordForm.get('confirmarPassword')?.touched">
                <input id="cp-confirmar" formControlName="confirmarPassword" matInput
                    [type]="hidePasswordConfirmar ? 'password' : 'text'" placeholder="••••••">
                <button mat-icon-button matSuffix type="button" (click)="hidePasswordConfirmar = !hidePasswordConfirmar"
                    aria-label="Mostrar contraseña">
                    <mat-icon>{{ hidePasswordConfirmar ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>
            <span class="app-dialog__error"
                *ngIf="changePasswordForm.hasError('noCoinciden') && changePasswordForm.get('confirmarPassword')?.touched">
                Las contraseñas no coinciden.
            </span>
            <span class="app-dialog__error"
                *ngIf="changePasswordForm.get('confirmarPassword')?.invalid && !changePasswordForm.hasError('noCoinciden') && changePasswordForm.get('confirmarPassword')?.touched">
                La contraseña debe tener al menos 4 caracteres.
            </span>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions class="app-dialog__footer">
    <button type="button" class="app-dialog__btn app-dialog__btn--outline" (click)="onNoClick()">Cancelar</button>
    <button type="button" class="app-dialog__btn app-dialog__btn--primary" (click)="onSave()" [disabled]="changePasswordForm.invalid || isSaving">
        <mat-spinner *ngIf="isSaving" diameter="18" style="display:inline-block"></mat-spinner>
        <span *ngIf="!isSaving">Guardar</span>
    </button>
</mat-dialog-actions>
